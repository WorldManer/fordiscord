<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Защита картинок</title>
  <style>
    img {
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      pointer-events: none;
    }

    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .protected {
      position: relative;
      display: inline-block;
    }
    .protected::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="protected">
    <img src="apex_logo.png" alt="APEX CORP" width="300">
  </div>

  <script>
    document.addEventListener('contextmenu', function (e) {
      if (e.target.tagName === 'IMG') {
        e.preventDefault();
      }
    });

    document.addEventListener('dragstart', function (e) {
      if (e.target.tagName === 'IMG') {
        e.preventDefault();
      }
    });

    document.addEventListener('copy', function (e) {
      e.preventDefault();
    });

    document.addEventListener('selectstart', function (e) {
      if (e.target.tagName === 'IMG') {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
