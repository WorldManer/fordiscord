<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEX CORP — Заявка</title>
  <link rel="icon" type="image/png" href="apex_logo.png" id="faviconLight">
  <link rel="stylesheet" href="/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .apply-page { max-width: 760px; margin: 0 auto; padding: 30px 20px 60px; }
    .apply-logo { display: flex; justify-content: center; margin-bottom: 22px; }
    .apply-logo img {
      display: block;
      max-width: 220px;
      width: 60%;
      height: auto;
      -webkit-user-drag: none; -khtml-user-drag: none; -moz-user-drag: none;
      -o-user-drag: none; user-drag: none;
      user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
      pointer-events: none;
    }
    .apply-header { text-align: center; margin-bottom: 30px; }
    .apply-header h1 { font-size: 2rem; margin: 0 0 10px; color: inherit; letter-spacing: 1px; }
    .apply-header p { opacity: 0.75; margin: 0; font-size: 0.95rem; }
    .apply-form {
      display: flex; flex-direction: column; gap: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px; padding: 26px 24px;
      backdrop-filter: blur(8px);
    }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field label { font-size: 0.9rem; font-weight: 600; opacity: 0.9; }
    .form-field input[type="text"],
    .form-field textarea,
    .form-field select {
      width: 100%; box-sizing: border-box; padding: 11px 13px; border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(0, 0, 0, 0.25); color: inherit;
      font-family: inherit; font-size: 0.92rem; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s; resize: vertical;
    }
    .form-field input:focus,
    .form-field textarea:focus,
    .form-field select:focus {
      border-color: #5865f2;
      box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.25);
    }
    .form-field textarea { min-height: 90px; }
    .form-field select option { background: #2b2d31; color: #f2f3f5; }
    .dm-warning {
      font-size: 0.9rem; line-height: 1.5; padding: 12px 14px;
      border-radius: 10px; background: rgba(250, 166, 26, 0.12);
      border: 1px solid rgba(250, 166, 26, 0.35); color: #faa61a;
    }
    .dm-warning a { color: #faa61a; font-weight: 600; }
    .apply-submit {
      margin-top: 8px; padding: 13px 22px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #5865f2, #7b52ff); color: #fff;
      font-family: inherit; font-weight: 600; font-size: 1rem; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    }
    .apply-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(88, 101, 242, 0.4);
    }
    .apply-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .form-status { margin-top: 6px; font-size: 0.9rem; min-height: 20px; text-align: center; line-height: 1.45; }
    .form-status.success { color: #3ba55d; }
    .form-status.error   { color: #ed4245; }
  </style>
</head>
<body>
  <header class="top-panel">
    <a href="/index" class="site-brand">
      <img src="/Pictures/sitelogow.png" alt="ForDis" class="brand-icon" id="brandIcon">
      ForDis
    </a>
    <div class="panel-nav">
      <a href="/avatars" class="panel-btn">Аватарки</a>
      <a href="/sounds" class="panel-btn">Звуки</a>
      <a href="/clients" class="panel-btn">Клиенты</a>
      <a href="/bots" class="panel-btn">Боты</a>
    </div>
    <div class="search-wrapper">
      <div class="search-input-container">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Поиск">
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
    <a href="/news" class="news-icon" title="Новости">
      <img src="/Pictures/megaphone1.png" alt="Новости" class="news-icon-img">
    </a>
  </header>

  <div class="page-layout">
    <aside class="sidebar">
      <a href="/settings-site" class="sidebar-btn">Настройки</a>
      <a href="/rules" class="sidebar-btn">Правила</a>
    </aside>

    <main class="main-content">
      <div class="apply-page">

        <div class="apply-logo">
          <img src="apex_logo.png" alt="APEX CORP">
        </div>

        <div class="apply-header">
          <h1>APEX CORP</h1>
          <p>Заполните все поля — заявка уйдёт на рассмотрение руководства.</p>
        </div>

        <form class="apply-form" id="apexForm" novalidate>
          <div class="form-field">
            <label for="robloxNick">Ваш ник в Roblox</label>
            <input type="text" id="robloxNick" name="robloxNick" placeholder="Например, ApexPlayer123" required>
          </div>

          <div class="form-field">
            <label for="discordNick">Ваш ник в Discord</label>
            <input type="text" id="discordNick" name="discordNick" placeholder="например, username#0000 или @username" required>
          </div>

          <div class="form-field">
            <label for="whyJoin">Почему хотите вступить к нам?</label>
            <textarea id="whyJoin" name="whyJoin" placeholder="Расскажите о мотивации" required></textarea>
          </div>

          <div class="form-field">
            <label for="brigade">В какую бригаду вы хотите вступить?</label>
            <select id="brigade" name="brigade" required>
              <option value="" disabled selected>Выберите бригаду</option>
              <option value="ШБ - Штурмовая бригада">ШБ - Штурмовая бригада</option>
              <option value="ОБ - Оборонительная бригада">ОБ - Оборонительная бригада</option>
              <option value="ИБ - Инженерная бригада">ИБ - Инженерная бригада</option>
            </select>
          </div>

          <div class="dm-warning">
            Перед подачей заявки убедитесь, что у вас открыты личные сообщения (ЛС).
            Подробнее о том, как открыть ЛС, можно узнать
            <a href="/dm_info" target="_blank" rel="noopener">тут</a>.
          </div>

          <button type="submit" class="apply-submit" id="submitBtn">Подать заявку</button>
          <div class="form-status" id="formStatus"></div>
        </form>
      </div>
    </main>
  </div>

  <script src="/1x03e.js"></script>
  <script src="ejtg984.js"></script>
  <script>
    document.addEventListener('contextmenu', function (e) {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });
    document.addEventListener('dragstart', function (e) {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });
    document.addEventListener('copy', function (e) {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });
  </script>
</body>
</html>
